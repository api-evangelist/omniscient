description: Omniscient is an AI intelligence platform for organizational decision-making, describing
  itself as a new class of AI that masters an organization's data and context to deliver decision-moving
  insights. Its focus areas include corporate reputation and narrative monitoring, geopolitical and
  regulatory risk tracking, marketing and narrative measurement, and supply chain and ESG risk, with an
  emphasis on early detection of weak signals and coordinated response. A Seedcamp portfolio company, it
  is added to the API Evangelist network for enrichment; as of this pass it publishes a marketing site
  (Azure Static Web Apps) with no public API, developer portal, or documentation surface.
